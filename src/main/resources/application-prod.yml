server:
  port: 8080

spring:
  datasource:
    # Trỏ thẳng tới container postgres trong cùng network Docker
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:incident_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # Lấy từ biến môi trường
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  encryption:
    key: ${APP_ENCRYPTION_KEY}

logging:
  level:
    root: INFO
    com.attt.incident: INFO

server:
  port: 8080

spring:
  application:
    name: incident-management

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/incident_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema do Flyway quản lý, JPA chỉ validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-in-production-min-256-bits-long}
    expiration-ms: 900000     # 15 phút
    refresh-expiration-ms: 604800000
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  encryption:
    key: ${APP_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}   # AES-256 key (base64) - ĐỔI khi triển khai thật

  # ── Admin Bootstrap ──────────────────────────────────────────────────────
  # Bật để tự động enable tài khoản admin lần đầu sau khi deploy.
  # Chỉ có hiệu lực khi APP_BOOTSTRAP_ADMIN_ENABLED=true.
  # TẮT NGAY sau lần login đầu tiên thành công.
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.attt.incident: DEBUG
    org.springframework.security: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
